name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install & Build Web
        run: |
          npm install
          npm install @capacitor/core@5.9.0 @capacitor/cli@5.9.0 @capacitor/android@5.9.0
          npm run build
          npx cap init DuressGuard com.robinremy.duressguard --web-dir=dist --npm-client npm
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DuressGuard-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
