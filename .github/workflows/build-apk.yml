name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - name: Install & Build Web
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm run build
          npx cap init DuressGuard com.robinremy.duressguard --web-dir=dist
          npx cap add android
          npx cap sync android
          
      - name: Fix Kotlin & Build APK
        run: |
          cd android
          
          # 1. Crear el parche para forzar una única versión de Kotlin
          cat << 'EOF' > parche-kotlin.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      eachDependency { DependencyResolveDetails details ->
                          if (details.requested.group == 'org.jetbrains.kotlin' && (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {
                              details.useVersion '1.8.22'
                          }
                      }
                  }
              }
          }
          EOF
          
          # 2. Dar permisos y compilar usando el parche
          chmod +x gradlew
          ./gradlew --init-script parche-kotlin.gradle assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DuressGuard-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
